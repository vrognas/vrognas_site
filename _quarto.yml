  favicon: "favicon.png"
  google-analytics: "G-83Y8K7VV1M"
  cookie-consent: true
  open-graph: true
  twitter-card: true
  site-url: https://vrognas.com
  site-path: "/"
  repo-url: https://github.com/vrognas/vrognas_site
  repo-actions: [source, issue]
  image: "images/vrognas.avif"
  reader-mode: true
  page-navigation: true
  bread-crumbs: true
  navbar:
    title: false
    logo: "images/logo.png"
    left:
