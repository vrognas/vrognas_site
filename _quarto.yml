project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "404.md"
    - "!CLAUDE.md"
  post-render:
    - scripts/stamp-modified.py
    - scripts/fix-sitemap.py
    - scripts/prune-empty-drafts.py

resources:
  - images/seedling_tiny_ps.svg
  - images/vrognas_full.png # referenced by the Person JSON-LD in seo.html
  - robots.txt
  - _redirects

execute:
  freeze: auto

